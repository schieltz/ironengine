<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>IRON ENGINE</title>
<style>
:root{
  --bg:#0E1012; --panel:#171A1D; --panel2:#1E2226; --line:#2A2F34;
  --ink:#E9E7E2; --ink-dim:#9BA1A6; --ink-faint:#5C6368;
  --blue:#3D7BD9; --blue-dim:#2A4E85;
  --green:#3FA372; --red:#C05043; --amber:#C99B3F;
  --mg-CHEST:#B85C8A; --mg-BACK:#4C93A8; --mg-TRICEPS:#9A5CB8; --mg-BICEPS:#4C7FA8;
  --mg-SHOULDERS:#B87A5C; --mg-HAMSTRINGS:#5CA86E; --mg-GLUTES:#7FA85C; --mg-QUADS:#A8A05C;
  --mg-CALVES:#8A7AB8; --mg-TRAPS:#8A8A9E; --mg-FOREARMS:#7A8AB8;

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink);font-family:-apple-system,'SF Pro Text',system-ui,sans-serif;
  font-size:16px;overscroll-behavior-y:contain}
body{padding-bottom:84px;min-height:100vh}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer;text-align:inherit}
input{font-family:inherit;color:inherit}
header{padding:18px 16px 10px;position:sticky;top:0;background:linear-gradient(var(--bg) 85%,transparent);z-index:20}
.h-title{font-size:26px;font-weight:800;letter-spacing:-0.5px}
.h-title .dim{color:var(--ink-faint);font-weight:700}
.h-sub{color:var(--ink-dim);font-size:13px;margin-top:2px}
.spine{display:flex;gap:5px;padding:12px 16px 4px}
.spine .wk{flex:1;text-align:center;padding:7px 0 5px;border-radius:8px;background:var(--panel);
  border:1px solid var(--line);color:var(--ink-faint)}
.spine .wk .n{font-size:15px;font-weight:800}
.spine .wk .r{font-size:9.5px;letter-spacing:.4px;margin-top:1px;text-transform:uppercase}
.spine .wk.active{background:var(--blue-dim);border-color:var(--blue);color:var(--ink)}
.spine .wk.done{color:var(--ink-dim);border-color:var(--ink-faint)}
.daytabs{display:flex;gap:6px;padding:8px 16px 2px}
.daytabs button{flex:1;padding:9px 0;border-radius:9px;background:var(--panel);border:1px solid var(--line);

.daytabs button.active{background:var(--panel2);border-color:var(--blue);color:var(--ink)}
.daytabs button .st{display:block;font-size:9px;margin-top:2px;font-weight:600;letter-spacing:.5px}
.daytabs button.complete .st{color:var(--green)}
.daytabs button.partial .st{color:var(--amber)}
main{padding:6px 12px}
.mg-tag{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:1.2px;padding:4px 10px;
  border-radius:6px;margin:14px 4px 6px;color:#0E1012;text-transform:uppercase}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:8px}
.ex-name{font-size:18px;font-weight:800;letter-spacing:-.3px;line-height:1.15}
.ex-meta{color:var(--ink-faint);font-size:12.5px;margin-top:2px}
.ex-note{background:#2B2617;color:#D9C27A;font-size:13px;padding:8px 10px;border-radius:8px;margin-top:8px}
.set-head{display:grid;grid-template-columns:44px 1fr 1fr 56px;gap:8px;padding:10px 2px 4px;

.set-row{display:grid;grid-template-columns:44px 1fr 1fr 56px;gap:8px;align-items:center;padding:5px 0}
.set-num{text-align:center;color:var(--ink-faint);font-size:13px;font-weight:700}
.set-row input{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:9px;

/* library */

.lib-search input{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:11px;

  border-radius:5px;padding:2px 6px;margin-left:6px;vertical-align:middle}

  border-radius:12px;padding:12px 14px;margin-bottom:7px;width:100%}

.slot.changed{border-color:var(--amber)}
.bd-tabs{display:flex;gap:6px;padding:0 4px 10px}
.bd-tabs button{flex:1;padding:9px 0;border-radius:9px;background:var(--panel);border:1px solid var(--line);
  color:var(--ink-dim);font-size:13px;font-weight:700;text-align:center}
.bd-tabs button.active{background:var(--panel2);border-color:var(--blue);color:var(--ink)}

  background:var(--blue);color:#fff;font-size:15px;font-weight:800;text-align:center}

  margin:14px 0;text-align:center}
.session-done .big{font-size:17px;font-weight:800}

<script>
/* ============================================================
   IRON ENGINE v2
   catalog + cross-meso history + meso builder + R8 soreness
   ============================================================ */
/* Storage adapter. Mode is picked once at startup:
   'claude' → window.storage (Claude artifact) · 'local' → localStorage, ONLY when window.storage
   is absent (self-hosted, e.g. GitHub Pages) · 'memory' → nothing persists (a banner warns).
   get() → {ok:true, value, raw} (value null = nothing saved yet) or {ok:false, error, raw}.
   A failed read is never reported as "nothing saved", so the app can't overwrite real data with the seed. */
const store = {
  mem:{}, mode:'memory',
  init(){
    if(window.storage){ this.mode='claude'; return; }
    try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t'); this.mode='local'; }catch(e){} },
  async getRaw(k){ /* string | null; throws when the read itself fails */
    if(this.mode==='claude'){
      try{ const r=await window.storage.get(k); return r?r.value:null; }
      catch(e){ if(/not.?found|does not exist|no such key/i.test(String(e&&e.message))) return null; throw e; } }
    if(this.mode==='local') return localStorage.getItem('ironengine:'+k);
    return this.mem[k]??null; },
  async get(k){
    let raw;
    try{ raw=await this.getRaw(k); }catch(error){ return {ok:false,error,raw:null}; }
    if(raw==null) return {ok:true,value:null,raw:null};
    try{ return {ok:true,value:JSON.parse(raw),raw}; }catch(error){ return {ok:false,error,raw}; } },
  async setRaw(k,s){ /* true only when actually persisted */
    this.mem[k]=s;
    try{
      if(this.mode==='claude'){ await window.storage.set(k,s); return true; }
      if(this.mode==='local'){ localStorage.setItem('ironengine:'+k,s); return true; }
    }catch(e){}
    return false; },
  set(k,v){ return this.setRaw(k,JSON.stringify(v)); }
};
store.init();

/* ---------- meso template library (from RP Templates tab) ----------

const TEMPLATES=[

/* ---------- state schema ----------
   Saved state carries v; unversioned saves are v1. To change the stored shape:
   bump SCHEMA_VERSION, append the upgrade step to MIGRATIONS, update seedState(),
   and add a migration test. */
const SCHEMA_VERSION=4;
const MIGRATIONS=[   /* MIGRATIONS[n-1] upgrades a v(n) state to v(n+1), in place */
  /* v1→v2: feedback moves off the exercise (where it applied to every later week) into
     meso.fb[session][exercise]. A legacy answer is attributed to the latest week of that
     day with anything logged, i.e. the session it most plausibly described. */
  s=>{
    const M=s.meso; M.fb={};
    M.days.forEach((day,di)=>day.forEach((ex,i)=>{
      if(ex.feedback){
        let last=0;
        for(const k of Object.keys(M.log)){
          const m=/^w(\d+)d(\d+)$/.exec(k);
          if(m && +m[2]===di+1 && (M.log[k][i]||[]).some(x=>x&&x.st)) last=Math.max(last,+m[1]);
        }
        if(last) (M.fb[key(last,di+1)]=M.fb[key(last,di+1)]||[])[i]=ex.feedback;
      }
      delete ex.feedback;
    }));
    if(s.draft) s.draft.days.forEach(day=>day.forEach(ex=>delete ex.feedback));
  },
  /* v2→v3: finished mesos are archived whole instead of discarded */
  s=>{ s.archive=s.archive||[]; },
  /* v3→v4: meso.dates[session] = local date its first set was logged (drives history dates) */
  s=>{ s.meso.dates=s.meso.dates||{}; },
];
function migrate(s){
  let v=s.v||1;
  if(v>SCHEMA_VERSION) throw new Error(`Saved data is from a newer app version (v${v}). Reload to update the app.`);
  while(v<SCHEMA_VERSION){ MIGRATIONS[v-1](s); v++; }
  s.v=SCHEMA_VERSION;
  return s;
}

/* ============================ @engine:begin ============================
   PROGRESSION ENGINE v2 — R1..R8
   Pure functions only: no DOM, storage, or app state. tests/harness.js runs
   everything from this banner to the engine:end marker headlessly in node.
   R8 soreness (recovery gate): asked per muscle at next session.
   0 never sore · 1 healed a while ago · 2 healed just on time · 3 still sore
   ============================================================ */
const RIR_RAMP=[3,2,2,1,0], DELOAD_RIR=8;
/* Every tunable coefficient. Calibration = change a value here + add a test. */
const RULES={
  loadStep:5,          // lb; prescribed loads round to this increment
  minLoad:5,           // lb; floor for any rounded load
  cutPct:0.08,         // R3 load cut (60→55 verified; the 8% itself is inferred)
  floorReps:4,         // R3: a later set at or below this many reps triggers the cut
  dropFromFirst:3,     // R3: a later set this many reps below set 1 triggers the cut
  painGate:2,          // R4: pain answer at or above this (2 = moderate) holds reps and sets
  setAdd:1,            // R2: sets added per exercise per week
  strongSetAdd:2,      // R5/R8: sets added on an under-stimulated signal
  staleWeeks:8,        // seeding: history older than this many weeks is discounted
  staleDiscount:0.10,  // seeding: discount on stale history
};
const pct=x=>Math.round(x*100);
function rirFor(week){ return week>RIR_RAMP.length ? DELOAD_RIR : RIR_RAMP[week-1]; }
function roundLoad(w){ return Math.max(RULES.minLoad,Math.round(w/RULES.loadStep)*RULES.loadStep); }
function weeksSince(dateStr){
  return Math.floor((Date.now()-new Date(dateStr).getTime())/(7*86400*1000));
}
function startingSets(name,hist,rir,nSets){
  const n=nSets||2;
  const h=hist[name], why=[];
  const mk=w=>Array.from({length:n},()=>({w,tgt:null,rir,st:null,reps:null}));
  if(!h){ return {sets:mk(null),
    why:`No history for this exercise → enter a weight you can handle at ${rir} RIR; that seeds the engine.${n===1?' Maintenance-priority slot: 1 starting set.':''}`}; }
  let w=h.w; const wk=h.date?weeksSince(h.date):null;
  if(wk!=null && wk>RULES.staleWeeks){ w=roundLoad(w*(1-RULES.staleDiscount));
    why.push(`Last performed ${wk} wks ago → starting load discounted ${pct(RULES.staleDiscount)}% to <b>${w}</b> (detraining buffer).`); }
  else why.push(`Seeded from your last top set: <b>${w}</b> (${h.date||'date unknown'}).`);
  why.push(`Work to ${rir} RIR — week 1 results become the baseline.`);
  if(n===1) why.push(`Maintenance-priority slot: 1 starting set.`);
  return {sets:mk(w),why:why.join(' ')};
}
function prescribe(ex, prevSets, week, feedback){
  const rir = rirFor(week);
  const why=[];
  const logged=(prevSets||[]).filter(s=>s && s.st==='logged' && s.reps!=null);
  if(!prevSets || logged.length===0){
    const base=(prevSets&&prevSets.length?prevSets:[{w:0}]).map(s=>({w:s.w,tgt:null,rir,st:null,reps:null}));
    return {sets:base,why:`No logged sets last week → same weights, work to <b>${rir} RIR</b> (R6).`};
  }
  if(week>RIR_RAMP.length){
    const n=Math.max(1,Math.ceil(logged.length/2));
    return {sets:logged.slice(0,n).map(s=>({w:s.w,tgt:null,rir:DELOAD_RIR,st:null,reps:null})),
      why:`Deload: <b>${n} set${n>1?'s':''}</b> at ${DELOAD_RIR} RIR — dissipate fatigue (R7).`};
  }
  const f=feedback||{};
  const painGate=f.pain>=RULES.painGate, soreGate=f.soreness===3;
  const firstReps=logged[0].reps;
  const sets=logged.map((s,i)=>{
    if(i>0 && (s.reps<=RULES.floorReps || (firstReps-s.reps)>=RULES.dropFromFirst)){
      const w=roundLoad(s.w*(1-RULES.cutPct));
      why.push(`Set ${i+1}: ${s.reps} reps last week (below range floor) → load cut to <b>${w}</b>, ${rir} RIR (R3).`);
      return {w,tgt:null,rir,st:null,reps:null};
    }
    return {w:s.w,tgt:painGate?s.reps:s.reps+1,rir:null,st:null,reps:null};
  });
  if(painGate){ why.push(`Joint pain → rep targets held, no set added (R4).`); return {sets,why:why.join(' ')}; }
  why.unshift(`Same weight, last week's reps <b>+1</b> (R1).`);
  if(soreGate){ why.push(`Still sore from last session → volume held, no set added (R8).`); }
  else if(f.workload===3){ why.push(`'Too much' workload → set count held (R5).`); }
  else{
    const strongAdd=(f.workload===0)||(f.soreness===0 && f.pump===0);
    const adds=strongAdd?RULES.strongSetAdd:RULES.setAdd;
    const lastW=sets[sets.length-1].w;
    for(let a=0;a<adds;a++) sets.push({w:lastW,tgt:null,rir,st:null,reps:null});
    why.push(`+${adds} set at <b>${lastW}</b> to <b>${rir} RIR</b> (R2${strongAdd?'+R5/R8: under-stimulated signal':''}).`);
  }
  return {sets,why:why.join(' ')};
}
/* ============================ @engine:end ============================== */

const escHtml=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);

let loadError=null;   /* saved data exists but couldn't be read: saving is blocked until the user decides */
let saveFailed=false;
async function init(){
  const r=await store.get('state2');
  let saved=null, upgrading=false;
  if(!r.ok) loadError=r;
  else if(r.value){
    try{ upgrading=r.value.v!==SCHEMA_VERSION; saved=migrate(r.value); }
    catch(error){ loadError={error,raw:r.raw}; }
  }
  ST=saved||seedState();
  selWeek=ST.meso.curWeek; selDay=ST.meso.curDay;
  await ensureDay(selWeek,selDay);
  if(upgrading) await save();
  render();
  if(loadError) renderLoadError();
}
async function save(){
  if(loadError) return;   /* never write over data we couldn't read */
  const ok=await store.set('state2',ST);
  if(saveFailed===ok){ saveFailed=!ok; renderBanner(); }
}
function renderBanner(){
  const msg=store.mode==='memory'?'Storage is blocked in this browser: nothing is being saved. Export a backup before closing.'
    :saveFailed?'Last save failed (storage full or blocked). Export a backup now.':'';
  $('banner').innerHTML=msg?`<div class="banner" onclick="setView('data')">⚠ ${msg}</div>`:'';
}
function renderLoadError(){
  const e=loadError, detail=escHtml(e.error&&e.error.message||e.error||'unknown error');
  $('modalRoot').innerHTML=`<div class="overlay"><div class="sheet">
    <h2>Couldn't read saved data</h2>
    <p class="sheet-p">Nothing has been changed or overwritten, and nothing will be saved until you choose below.</p>
    <p class="sheet-p" style="color:var(--ink-faint)">${detail}</p>
    <div class="sheet-stack">
      <button class="btn-primary" onclick="location.reload()">Retry</button>
      ${e.raw?`<button class="btn-ghost" onclick="copyRaw()">Copy raw saved data</button>`:''}
      <button class="btn-ghost" onclick="$('importInput').click()">Restore from backup file</button>
      <button class="btn-ghost" style="color:var(--red)" onclick="startFresh()">Start fresh</button>
    </div></div></div>`;
}
async function copyRaw(){
  try{ await navigator.clipboard.writeText(loadError.raw); toast('Copied'); }catch(e){ toast('Clipboard blocked'); }
}
/* Clears a load error by overwriting. Unreadable raw data is copied to a backup key first. */
async function overwriteUnreadable(){
  if(loadError.raw && !await store.setRaw(`state2.unreadable-${Date.now()}`,loadError.raw)){
    toast('Could not back up the old data, so nothing was overwritten'); return false; }
  loadError=null; $('modalRoot').innerHTML=''; return true;
}
async function startFresh(){
  if(!confirm(loadError.raw?'Start fresh? The unreadable data is kept under a backup key first.'
    :'Start fresh? This replaces whatever is saved. If the problem was temporary, choose Retry instead.')) return;
  if(!await overwriteUnreadable()) return;
  ST=seedState(); selWeek=ST.meso.curWeek; selDay=ST.meso.curDay;
  await ensureDay(selWeek,selDay); await save(); view='workout'; render();
}
function key(w,d){ return `w${w}d${d}`; }
/* local calendar date; toISOString() is UTC, which stamps US evening sessions as tomorrow */
function localDate(d=new Date()){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }

/* Prescriptions stay provisional until you touch an exercise (log, skip, edit, or add a set).
   Every visit recomputes untouched exercises from the prior week, so looking ahead never freezes
   stale numbers. Touched exercises are yours and are never recomputed. */
const touched=sets=>!!sets&&sets.some(s=>s.st||s.u);
/* feedback given in session k for exercise i; it shapes the next week's prescription */
const fbFor=(k,i)=>(ST.meso.fb[k]||[])[i]||null;
async function ensureDay(w,d){ if(planDay(w,d)) await save(); }
function planDay(w,d){ /* returns true when anything changed */
  const M=ST.meso, k=key(w,d), exs=M.days[d-1];
  let changed=!M.log[k];
  const log=M.log[k]||(M.log[k]=exs.map(()=>null));
  if(exs.every((_,i)=>touched(log[i]))) return changed;
  if(w>1 && planDay(w-1,d)) changed=true;
  const prev=M.log[key(w-1,d)];
  exs.forEach((ex,i)=>{
    if(touched(log[i])) return;
    let p;
    if(w===1) p=startingSets(ex.name,ST.hist,rirFor(1),ex.pri===0?1:2);
    else{
      p=prescribe(ex,prev[i],w,fbFor(key(w-1,d),i));
      if(!prev[i].some(s=>s.st)) p.why=`Preview: ${DAYS[d-1]} week ${w-1} isn't logged yet, so this repeats its weights `
        +`at <b>${rirFor(w)} RIR</b>. Updates automatically once you log it.`;
    }
    ex._why=ex._why||{};
    if(JSON.stringify([log[i],ex._why[k]])!==JSON.stringify([p.sets,p.why])) changed=true;
    log[i]=p.sets; ex._why[k]=p.why;
  });
  return changed;
}

function setRow(ei,si,s){
  const repVal=s.st==='skipped'?'':(s.reps!=null?s.reps:(s.tgt!=null?s.tgt:''));
  const repPh=s.st==='skipped'?'skipped':(s.tgt==null&&s.reps==null?`${s.rir??2} RIR`:'');

  const btnTxt=s.st==='logged'?'✓':s.st==='skipped'?'−':'';
  return `<div class="set-row">
    <span class="set-num">${si+1}</span>
    <input type="number" inputmode="decimal" value="${s.w??''}" onchange="upd(${ei},${si},'w',this.value)">
    <input type="number" inputmode="numeric" class="${repPh?'rir-ph':''}" value="${repVal}" placeholder="${repPh}"
      onchange="upd(${ei},${si},'reps',this.value)">
    <button class="log-btn ${btnCls}" onclick="tapLog(${ei},${si})">${btnTxt}</button>
  </div>`;
}
async function upd(ei,si,f,v){
  const s=ST.meso.log[key(selWeek,selDay)][ei][si];
  s[f]=v===''?null:parseFloat(v); s.u=1;   /* u: user-touched, freezes this exercise's prescription */
  await save();
}
/* Log button: open set → logged (empty reps take the target); logged or skipped → open again,
   reps kept. An open set with no reps and no target needs a second tap to skip. */
let skipArm=null;
async function tapLog(ei,si){
  const k=key(selWeek,selDay), s=ST.meso.log[k][ei][si], id=`${k}:${ei}:${si}`;
  if(s.st) s.st=null;
  else{
    if(s.reps==null && s.tgt!=null) s.reps=s.tgt;
    if(s.reps==null){
      if(skipArm!==id){ skipArm=id; toast('Enter reps first, or tap again to skip'); return; }
      s.st='skipped';
    } else{ s.st='logged'; ST.meso.dates[k]=ST.meso.dates[k]||localDate(); }
  }
  s.u=1; skipArm=null;
  await save(); render();
}
async function skipRest(ei){
  ST.meso.log[key(selWeek,selDay)][ei].forEach(s=>{ if(!s.st){ s.st='skipped'; s.reps=null; s.u=1; } });
  await save(); render();
}
async function addSet(ei){
  const sets=ST.meso.log[key(selWeek,selDay)][ei];
  const lastW=sets.length?sets[sets.length-1].w:null;
  sets.push({w:lastW,tgt:null,rir:rirFor(selWeek),st:null,reps:null,u:1});
  await save(); render();
}

/* ---------- feedback (now incl. soreness R8) ---------- */
let fbState=null;
function openFeedback(ei){
  const f=fbFor(key(selWeek,selDay),ei)||{};
  fbState={ei,soreness:f.soreness??null,pain:f.pain??null,pump:f.pump??null,workload:f.workload??null};
  renderFB();
}
function renderFB(){
  const ex=ST.meso.days[selDay-1][fbState.ei];
  const opt=(f,i,l)=>`<button class="${fbState[f]===i?'sel':''}" onclick="fbState.${f}=${i};renderFB()">${l}</button>`;
  $('modalRoot').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeFB()">
    <div class="sheet">
      <h2>Feedback</h2>
      <p style="color:var(--ink-dim);font-size:13px">${ex.name} · ${ex.mg.toLowerCase()}</p>
      <div class="q"><h3>${cap(ex.mg)} soreness</h3><p>How sore did you get AFTER training them last time?</p>
        <div class="opts">${['Never got sore','Healed a while ago','Healed just on time',"I'm still sore!"].map((l,i)=>opt('soreness',i,l)).join('')}</div></div>
      <div class="q"><h3>Joint pain</h3><p>How did your joints feel during this exercise?</p>
        <div class="opts">${['None','Low pain','Moderate pain','A lot of pain'].map((l,i)=>opt('pain',i,l)).join('')}</div></div>
      <div class="q"><h3>Pump</h3><p>How much of a pump in your ${ex.mg.toLowerCase()}?</p>
        <div class="opts o3">${['Low pump','Moderate pump','Amazing pump'].map((l,i)=>opt('pump',i,l)).join('')}</div></div>
      <div class="q"><h3>Workload</h3><p>How was the number of hard sets?</p>
        <div class="opts">${['Not enough','Just right','Pushed my limits','Too much'].map((l,i)=>opt('workload',i,l)).join('')}</div></div>
      <div class="sheet-actions">
        <button class="btn-ghost" onclick="closeFB()">Cancel</button>
        <button class="btn-primary" ${[fbState.soreness,fbState.pain,fbState.pump,fbState.workload].some(x=>x==null)?'disabled':''}
          onclick="saveFB()">Save</button>
      </div>
    </div></div>`;
}
const cap=s=>s[0]+s.slice(1).toLowerCase();
function closeFB(){ $('modalRoot').innerHTML=''; fbState=null; }
async function saveFB(){
  const M=ST.meso, k=key(selWeek,selDay);
  (M.fb[k]=M.fb[k]||[])[fbState.ei]={soreness:fbState.soreness,pain:fbState.pain,pump:fbState.pump,workload:fbState.workload};
  await save(); closeFB(); render(); toast('Saved — feeds next week (R2/R4/R5/R8)');
}

/* ---------- library ---------- */
function renderLibrary(){
  const list=CATALOG.filter(c=>
    (libMg==='ALL'||c.mg===libMg) &&
    (!libHome||c.home) &&
    (!libQ||c.name.toLowerCase().includes(libQ.toLowerCase())));
  list.sort((a,b)=>a.name.localeCompare(b.name));
  $('main').innerHTML=`
    <div class="lib-search"><input placeholder="Search ${CATALOG.length} exercises" value="${libQ}"
      oninput="libQ=this.value;renderLibrary()"></div>
    <div class="chiprow">
      <button class="chip home ${libHome?'sel':''}" onclick="libHome=!libHome;renderLibrary()">⌂ Home only</button>
      <button class="chip ${libMg==='ALL'?'sel':''}" onclick="libMg='ALL';renderLibrary()">All</button>
      ${MGS.map(m=>`<button class="chip ${libMg===m?'sel':''}" onclick="libMg='${m}';renderLibrary()">${cap(m)}</button>`).join('')}
    </div>
    ${list.map(c=>{
      const h=ST.hist[c.name];
      return `<button class="lib-item" onclick="toast('${esc(c.name)} — last: ${c.last}${h?' @ '+h.w:''}')">
        <span class="dot" style="background:var(--mg-${c.mg})"></span>
        <span class="li-main"><span class="li-name">${c.name}${c.home?'':'<span class="badge-gym">GYM</span>'}</span>
        <span class="li-sub">${cap(c.mg)} · ${c.equip}</span></span>
        <span class="li-right">${h?`<div class="li-w">${h.w}</div>`:''}<div class="li-date">${c.last}</div></span>
      </button>`;}).join('')||'<p style="color:var(--ink-faint);padding:20px;text-align:center">No matches</p>'}`;
}

/* ---------- meso builder ---------- */
function renderBuilder(){
  if(!ST.draft){
    $('main').innerHTML=`
      <div class="eng-block"><h3>Two ways to draft</h3>
      <p><b>Copy current</b> keeps your exercises and lets you swap slots. <b>From template</b> starts with an RP-style
      muscle-group blueprint — each slot is auto-filled with your most recent home-compatible exercise for that muscle
      (tap to swap). Full-priority slots start at 2 sets, maintenance slots at 1; the engine grows both. Either way,
      history follows every exercise.</p></div>
      <button class="bigbtn" onclick="makeDraft()">Draft from current meso</button>
      <div class="mg-tag" style="background:var(--panel2);color:var(--ink-dim)">TEMPLATE LIBRARY</div>
      ${TEMPLATES.map((t,i)=>`<button class="slot" onclick="makeDraftFromTemplate(${i})">
        <span class="li-main"><span class="li-name">${t.name}</span>
        <span class="li-sub">${t.days.map((d,j)=>DAYS[j]+' '+d.length).join(' · ')} slots ·
        ${t.days.flat().filter(s=>s[1]===0).length} maintenance</span></span>
        <span class="swap">Use ›</span></button>`).join('')}`;
    return;
  }
  const D=ST.draft, dayExs=D.days[bdDay-1];
  let lastMg='';
  $('main').innerHTML=`
    <div class="bd-tabs">${DAYS.map((d,i)=>`<button class="${bdDay===i+1?'active':''}"
      onclick="bdDay=${i+1};render()">${d}</button>`).join('')}</div>
    ${dayExs.map((ex,i)=>{
      const tag=ex.mg!==lastMg?`<span class="mg-tag" style="background:var(--mg-${ex.mg})">${ex.mg}</span>`:'';
      lastMg=ex.mg;
      const h=ST.hist[ex.name];
      const priTag=ex.pri===0?' · <span style="color:var(--amber)">maintenance</span>':'';
      return tag+`<button class="slot ${ex._swapped?'changed':''}" onclick="openSwap(${i})">
        <span class="dot" style="background:var(--mg-${ex.mg});width:9px;height:9px;border-radius:50%;flex:0 0 auto"></span>
        <span class="li-main"><span class="li-name">${ex.name}</span>
        <span class="li-sub">${ex.equip}${h?` · last ${h.w}`:''}${priTag}</span></span>
        <span class="swap">Swap ›</span></button>`;
    }).join('')}
    <button class="bigbtn" onclick="activateDraft()">Activate meso — archive current</button>
    <button class="bigbtn ghost" onclick="discardDraft()">Discard draft</button>`;
}
async function makeDraft(){
  const M=ST.meso;
  ST.draft={name:'Next meso (draft)',weeks:5,
    days:M.days.map(day=>day.map(ex=>({name:ex.name,mg:ex.mg,equip:ex.equip,note:ex.note,pri:ex.pri??1})))};
  bdDay=1; await save(); render();
}
/* most recently performed home-compatible exercise per mg, excluding already-used names */
function autoPick(mg,used){
  const cands=CATALOG.filter(c=>c.mg===mg&&c.home&&!used.has(c.name))
    .sort((a,b)=>(b.last||'').localeCompare(a.last||''));
  return cands[0]||CATALOG.find(c=>c.mg===mg&&c.home)||CATALOG.find(c=>c.mg===mg);
}
async function makeDraftFromTemplate(ti){
  const t=TEMPLATES[ti];
  ST.draft={name:t.name+' (draft)',weeks:5,days:t.days.map(day=>{
    const used=new Set();
    return day.map(([mg,pri,pinned])=>{
      const c=pinned&&CAT_BY_NAME[pinned]?CAT_BY_NAME[pinned]:autoPick(mg,used);
      used.add(c.name);
      return {name:c.name,mg,equip:c.equip,note:null,pri,_auto:!pinned};
    });
  })};
  bdDay=1; await save(); render();
  toast('Slots auto-filled — tap any to swap');
}
function openSwap(slotIdx){
  swapCtx={slotIdx,mg:ST.draft.days[bdDay-1][slotIdx].mg,home:true,q:''};
  renderSwap();
}
function renderSwap(){
  const c=swapCtx;
  const list=CATALOG.filter(x=>(c.mg==='ALL'||x.mg===c.mg)&&(!c.home||x.home)
    &&(!c.q||x.name.toLowerCase().includes(c.q.toLowerCase())));
  list.sort((a,b)=>a.name.localeCompare(b.name));
  $('modalRoot').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeSwap()">
    <div class="sheet">
      <h2>Swap exercise</h2>
      <div class="lib-search" style="margin:10px 0 6px"><input placeholder="Search" value="${c.q}"
        oninput="swapCtx.q=this.value;renderSwap()"></div>
      <div class="chiprow">
        <button class="chip home ${c.home?'sel':''}" onclick="swapCtx.home=!swapCtx.home;renderSwap()">⌂ Home only</button>
        <button class="chip ${c.mg==='ALL'?'sel':''}" onclick="swapCtx.mg='ALL';renderSwap()">All muscles</button>
        ${MGS.map(m=>`<button class="chip ${c.mg===m?'sel':''}" onclick="swapCtx.mg='${m}';renderSwap()">${cap(m)}</button>`).join('')}
      </div>
      ${list.map(x=>{const h=ST.hist[x.name];
        return `<button class="lib-item" onclick="doSwap('${esc(x.name)}')">
        <span class="dot" style="background:var(--mg-${x.mg})"></span>
        <span class="li-main"><span class="li-name">${x.name}${x.home?'':'<span class="badge-gym">GYM</span>'}</span>
        <span class="li-sub">${cap(x.mg)} · ${x.equip}</span></span>
        <span class="li-right">${h?`<div class="li-w">${h.w}</div>`:''}<div class="li-date">${x.last}</div></span>
        </button>`;}).join('')}
    </div></div>`;
}
function closeSwap(){ $('modalRoot').innerHTML=''; swapCtx=null; }
async function doSwap(name){
  const c=CAT_BY_NAME[name], slot=ST.draft.days[bdDay-1][swapCtx.slotIdx];
  Object.assign(slot,{name:c.name,mg:c.mg,equip:c.equip,_swapped:true,_auto:false,note:null});
  closeSwap(); await save(); render(); toast(`Swapped in ${name}`);
}
async function discardDraft(){
  if(!confirm('Discard this draft? The current meso is not affected.')) return;
  ST.draft=null; await save(); render();
}
/* History = each exercise's LAST top set: the heaviest logged set in its most recent session
   (schedule order), dated when that session was trained. It can go down. Sessions logged before
   dates were recorded borrow the meso's latest known date, or null (shown as "date unknown"). */
function harvestHistory(M,hist){
  const order=k=>{ const m=/^w(\d+)d(\d+)$/.exec(k); return m?(+m[1])*10+(+m[2]):-1; };
  const fallback=Object.values(M.dates).sort().pop()||null;
  Object.keys(M.log).filter(k=>order(k)>0).sort((a,b)=>order(a)-order(b)).forEach(k=>{
    const day=M.days[order(k)%10-1]||[];
    (M.log[k]||[]).forEach((sets,i)=>{
      const logged=(sets||[]).filter(s=>s.st==='logged'&&s.w);
      if(day[i]&&logged.length) hist[day[i].name]={w:Math.max(...logged.map(s=>s.w)),date:M.dates[k]||fallback};
    });
  });
}
async function activateDraft(){
  if(!confirm(`Start "${ST.draft.name.replace(' (draft)','')}" now?\n\nThe current meso moves to the archive (all its sets are kept) and its top sets update your exercise history.`)) return;
  const M=ST.meso;
  harvestHistory(M,ST.hist);
  ST.archive.push({...M,archivedAt:localDate()});
  const D=ST.draft;
  ST.meso={name:D.name.replace(' (draft)','')+' · '+localDate(),weeks:D.weeks,curWeek:1,curDay:1,
    days:D.days.map(day=>day.map(ex=>({name:ex.name,mg:ex.mg,equip:ex.equip,note:ex.note,pri:ex.pri??1}))),log:{},fb:{},dates:{}};
  ST.draft=null; selWeek=1; selDay=1;
  await ensureDay(1,1); await save();
  view='workout'; render(); toast('New meso active — history carried forward');
}

/* ---------- engine ---------- */
function renderEngine(){
  $('main').innerHTML=`
  <div class="eng-block"><h3>R1 · Rep progression</h3>
    <p>Same weight, last week's reps <code>+1</code> per matched set. Verified vs RP exactly.</p></div>
  <div class="eng-block"><h3>R2 · Set addition</h3>
    <p>+${RULES.setAdd} set/exercise/week by default; new sets get weight only, worked to the week's RIR. Gated by R4/R5/R8.</p></div>
  <div class="eng-block"><h3>R3 · Load autoregulation</h3>
    <p>Later sets at <code>≤${RULES.floorReps} reps</code> or <code>≥${RULES.dropFromFirst}</code> below set 1 → <code>~${pct(RULES.cutPct)}%</code> load cut, RIR reset. Verified: 60×4 → RP prescribed 55. Exact match.</p></div>
  <div class="eng-block"><h3>R4 · Pain gate</h3>
    <p>Moderate+ joint pain → rep targets held, no set added.</p></div>
  <div class="eng-block"><h3>R5 · Workload feedback</h3>
    <p><code>Too much</code> → hold set count. <code>Not enough</code> → +${RULES.strongSetAdd} sets.</p></div>
  <div class="eng-block"><h3>R6 · Missing data</h3>
    <p>All sets skipped → same weights re-prescribed, RIR target only. Matches RP.</p></div>
  <div class="eng-block"><h3>R7 · Deload</h3>
    <p>Week ${RIR_RAMP.length+1}: half the sets at ${DELOAD_RIR} RIR.</p></div>
  <div class="eng-block"><h3>R8 · Soreness (recovery gate)</h3>
    <p>Asked per muscle: still sore → volume held. Never sore + low pump → strongest add signal (+${RULES.strongSetAdd} sets).
    'Healed just on time' is the optimum — standard progression.</p></div>
  <div class="eng-block"><h3>Cross-meso seeding</h3>
    <p>Exercises own their history. Returning after <code>>${RULES.staleWeeks} wks</code> → last load −${pct(RULES.staleDiscount)}%; sooner → last load as-is; week 1 always works to RIR.</p></div>`;
}

/* ---------- data ---------- */
function renderData(){
  $('main').innerHTML=`
  <div class="eng-block"><h3>Backup</h3><p>Everything (current meso, history, ${ST.archive.length} archived
    meso${ST.archive.length===1?'':'s'}, draft) in one file. Save it to Files or iCloud. Restoring replaces all current data.</p>
    <div class="card-actions"><button onclick="saveBackup()">Save backup file</button><button onclick="doExport()">Copy JSON</button></div>
    <div class="card-actions"><button onclick="$('importInput').click()">Restore from backup file</button></div></div>
  <div class="eng-block"><h3>Storage</h3><p>${{
    claude:'Saved in Claude artifact storage.',
    local:'Saved in this browser only. On iPhone, the home-screen app and Safari keep separate copies: always use the same one. Back up regularly.',
    memory:'<b style="color:var(--red)">Not being saved.</b> This browser blocks storage; everything is lost when the app closes. Export now.'}[store.mode]}</p></div>
  <div class="eng-block"><h3>Reset</h3><p>Erases everything, including history and the archive, and restores the RP-screenshot seed.</p>
    <div class="card-actions"><button onclick="doReset()" style="color:var(--red)">Reset to seed</button></div></div>`;
}
const backupJSON=()=>JSON.stringify(ST,null,1);
async function saveBackup(){
  const name=`ironengine-backup-${localDate()}.json`;
  const file=new File([backupJSON()],name,{type:'application/json'});
  try{ /* iPhone: share sheet → Save to Files / iCloud / AirDrop */
    if(navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:name}); return; }
  }catch(e){ if(e.name==='AbortError') return; }
  const a=document.createElement('a'); a.href=URL.createObjectURL(file); a.download=name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
async function doExport(){
  try{ await navigator.clipboard.writeText(backupJSON()); toast('Copied'); }
  catch(e){ toast('Clipboard blocked — see console'); console.log(backupJSON()); }
}
function parseBackup(text){
  let s;
  try{ s=JSON.parse(text); }catch(e){ return {ok:false,error:'Not a valid backup file'}; }
  if(!s||typeof s!=='object'||!s.meso||!Array.isArray(s.meso.days)||!s.meso.log||typeof s.hist!=='object')
    return {ok:false,error:'Not an IRON ENGINE backup'};
  try{ migrate(s); }catch(e){ return {ok:false,error:e.message}; }
  return {ok:true,state:s};
}
async function importText(text){
  const r=parseBackup(text);
  if(!r.ok){ toast(r.error); return false; }
  const s=r.state;
  if(!confirm(`Replace ALL current data with this backup?\n\n${s.meso.name} · ${Object.keys(s.hist).length} exercises in history · ${s.archive.length} archived`)) return false;
  if(loadError && !await overwriteUnreadable()) return false;
  ST=s; selWeek=ST.meso.curWeek; selDay=ST.meso.curDay;
  await ensureDay(selWeek,selDay); await save(); view='workout'; render(); toast('Backup restored');
  return true;
}
async function importFile(input){
  const f=input.files&&input.files[0]; input.value='';
  if(f) await importText(await f.text());
}
async function doReset(){
  if(!confirm('Erase EVERYTHING (current meso, history, archive) and restore the demo seed?\n\nSave a backup first. This cannot be undone.')) return;
  ST=seedState(); selWeek=ST.meso.curWeek; selDay=ST.meso.curDay;
  await ensureDay(selWeek,selDay); await save(); view='workout'; render(); toast('Reset');
}
init();
</script>
