<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>IRON ENGINE</title>
<style>
:root{
  --bg:#0E1012; --panel:#171A1D; --panel2:#1E2226; --line:#2A2F34;
  --ink:#E9E7E2; --ink-dim:#9BA1A6; --ink-faint:#5C6368;
  --blue:#3D7BD9; --blue-dim:#2A4E85;
  --green:#3FA372; --red:#C05043; --amber:#C99B3F;
  --mg-CHEST:#B85C8A; --mg-BACK:#4C93A8; --mg-TRICEPS:#9A5CB8; --mg-BICEPS:#4C7FA8;
  --mg-SHOULDERS:#B87A5C; --mg-HAMSTRINGS:#5CA86E; --mg-GLUTES:#7FA85C; --mg-QUADS:#A8A05C;
  --mg-CALVES:#8A7AB8; --mg-TRAPS:#8A8A9E; --mg-FOREARMS:#7A8AB8;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink);font-family:-apple-system,'SF Pro Text',system-ui,sans-serif;
  font-size:16px;overscroll-behavior-y:contain}
body{padding-bottom:84px;min-height:100vh}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer;text-align:inherit}
input{font-family:inherit;color:inherit}
header{padding:18px 16px 10px;position:sticky;top:0;background:linear-gradient(var(--bg) 85%,transparent);z-index:20}
.h-title{font-size:26px;font-weight:800;letter-spacing:-0.5px}
.h-title .dim{color:var(--ink-faint);font-weight:700}
.h-sub{color:var(--ink-dim);font-size:13px;margin-top:2px}
.spine{display:flex;gap:5px;padding:12px 16px 4px}
.spine .wk{flex:1;text-align:center;padding:7px 0 5px;border-radius:8px;background:var(--panel);
  border:1px solid var(--line);color:var(--ink-faint)}
.spine .wk .n{font-size:15px;font-weight:800}
.spine .wk .r{font-size:9.5px;letter-spacing:.4px;margin-top:1px;text-transform:uppercase}
.spine .wk.active{background:var(--blue-dim);border-color:var(--blue);color:var(--ink)}
.spine .wk.done{color:var(--ink-dim);border-color:var(--ink-faint)}
.daytabs{display:flex;gap:6px;padding:8px 16px 2px}
.daytabs button{flex:1;padding:9px 0;border-radius:9px;background:var(--panel);border:1px solid var(--line);
  color:var(--ink-dim);font-size:13px;font-weight:700;text-align:center}
.daytabs button.active{background:var(--panel2);border-color:var(--blue);color:var(--ink)}
.daytabs button .st{display:block;font-size:9px;margin-top:2px;font-weight:600;letter-spacing:.5px}
.daytabs button.complete .st{color:var(--green)}
.daytabs button.partial .st{color:var(--amber)}
main{padding:6px 12px}
.mg-tag{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:1.2px;padding:4px 10px;
  border-radius:6px;margin:14px 4px 6px;color:#0E1012;text-transform:uppercase}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:8px}
.ex-name{font-size:18px;font-weight:800;letter-spacing:-.3px;line-height:1.15}
.ex-meta{color:var(--ink-faint);font-size:12.5px;margin-top:2px}
.ex-note{background:#2B2617;color:#D9C27A;font-size:13px;padding:8px 10px;border-radius:8px;margin-top:8px}
.set-head{display:grid;grid-template-columns:44px 1fr 1fr 56px;gap:8px;padding:10px 2px 4px;
  color:var(--ink-faint);font-size:10.5px;font-weight:700;letter-spacing:1px;text-align:center}
.set-row{display:grid;grid-template-columns:44px 1fr 1fr 56px;gap:8px;align-items:center;padding:5px 0}
.set-num{text-align:center;color:var(--ink-faint);font-size:13px;font-weight:700}
.set-row input{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:9px;
  padding:11px 4px;font-size:19px;font-weight:700;text-align:center;color:var(--ink)}
.set-row input:focus{outline:none;border-color:var(--blue)}
.set-row input.rir-ph{color:var(--ink-dim);font-size:15px}
.log-btn{height:44px;border-radius:9px;border:1.5px solid var(--line);background:var(--panel2);
  font-size:18px;color:var(--ink-faint);text-align:center}
.log-btn.next{border-color:var(--blue)}
.log-btn.logged{background:var(--green);border-color:var(--green);color:#0E1012}
.log-btn.skipped{background:var(--panel2);border-color:var(--ink-faint);color:var(--ink-dim)}
.why{margin-top:4px;font-size:11.5px;color:var(--ink-faint);padding:0 2px;line-height:1.45}
.why b{color:var(--blue);font-weight:700}
.card-actions{display:flex;gap:8px;margin-top:10px}
.card-actions button.more{flex:0 0 48px;font-size:17px;letter-spacing:1px}
.card-actions button{flex:1;padding:9px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);
  font-size:12.5px;font-weight:700;color:var(--ink-dim);text-align:center}
.fb-done{border-color:var(--green)!important;color:var(--green)!important}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:rgba(14,16,18,.92);
  backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 0 max(14px,env(safe-area-inset-bottom));z-index:30}
nav button{flex:1;text-align:center;color:var(--ink-faint);font-size:10.5px;font-weight:700;padding-top:4px}
nav button .ic{display:block;font-size:19px;margin-bottom:2px}
nav button.active{color:var(--blue)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:flex;align-items:flex-end}
.sheet{background:var(--panel);border-radius:18px 18px 0 0;width:100%;padding:22px 18px max(24px,env(safe-area-inset-bottom));
  max-height:85vh;overflow-y:auto}
.sheet h2{font-size:24px;font-weight:800;margin-bottom:4px}
.sheet .q{margin-top:16px}
.sheet .q h3{font-size:15px;font-weight:700}
.sheet .q p{color:var(--ink-dim);font-size:13px;margin:3px 0 9px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opts.o3{grid-template-columns:1fr 1fr 1fr}
.opts button{padding:13px 6px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);
  font-size:12.5px;font-weight:600;color:var(--ink);text-align:center}
.opts button.sel{border-color:var(--blue);background:var(--blue-dim)}
.sheet-actions{display:flex;gap:10px;margin-top:22px}
.sheet-actions button{flex:1;padding:14px;border-radius:11px;font-size:15px;font-weight:700;text-align:center}
.btn-ghost{background:var(--panel2);border:1px solid var(--line);color:var(--ink-dim)}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:disabled{opacity:.35}
.eng-block{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:10px}
.eng-block h3{font-size:15px;font-weight:800;color:var(--blue);letter-spacing:.3px;margin-bottom:6px}
.eng-block p{font-size:13.5px;color:var(--ink-dim);line-height:1.55}
.eng-block code{background:var(--panel2);padding:1px 6px;border-radius:5px;font-size:12.5px;color:var(--ink)}
.banner{margin-top:8px;background:#3A1C18;border:1px solid var(--red);color:#F0B8B0;font-size:13px;font-weight:600;

.sheet-p{color:var(--ink-dim);font-size:14px;line-height:1.45;margin-top:8px}
.sheet-stack{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.sheet-stack button{min-height:48px;padding:13px;border-radius:11px;font-size:15px;font-weight:700;text-align:center}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--panel2);
  border:1px solid var(--blue);color:var(--ink);padding:11px 18px;border-radius:11px;font-size:14px;font-weight:600;
  z-index:50;white-space:nowrap;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
/* library */
.lib-search{margin:4px 4px 8px;display:flex;gap:8px}
.lib-search input{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:11px;
  padding:12px 14px;font-size:15px}
.lib-search input:focus{outline:none;border-color:var(--blue)}
.chiprow{display:flex;gap:6px;overflow-x:auto;padding:2px 4px 10px;-webkit-overflow-scrolling:touch}
.chiprow::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:7px 13px;border-radius:99px;background:var(--panel);border:1px solid var(--line);
  font-size:12.5px;font-weight:700;color:var(--ink-dim);text-align:center}
.chip.sel{background:var(--blue-dim);border-color:var(--blue);color:var(--ink)}
.chip.home.sel{background:#1F3326;border-color:var(--green);color:var(--ink)}
.lib-item{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:12px 14px;margin:0 4px 7px;width:calc(100% - 8px)}
.lib-item .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.lib-item .li-main{flex:1;min-width:0}
.lib-item .li-name{font-size:15.5px;font-weight:700;line-height:1.2}
.lib-item .li-sub{font-size:12px;color:var(--ink-faint);margin-top:1px}
.lib-item .li-right{text-align:right;flex:0 0 auto}
.lib-item .li-w{font-size:14px;font-weight:800;color:var(--blue)}
.lib-item .li-date{font-size:10.5px;color:var(--ink-faint)}

.form-label{font-size:13px;font-weight:700;color:var(--ink-dim);margin:16px 0 8px}
.form-input{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;
  font-size:16px;color:var(--ink);min-height:44px}
.form-input:focus{outline:none;border-color:var(--blue)}
.chip-wrap{display:flex;flex-wrap:wrap;gap:6px}
.form-err{color:var(--red);font-size:13px;margin-top:8px;min-height:18px}
.badge-gym{font-size:9px;font-weight:800;letter-spacing:.6px;background:#33231B;color:#C98B5C;
  border-radius:5px;padding:2px 6px;margin-left:6px;vertical-align:middle}
/* builder */
.slot{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:12px 14px;margin-bottom:7px;width:100%}
.slot .swap{color:var(--blue);font-size:13px;font-weight:700;flex:0 0 auto}
.slot.changed{border-color:var(--amber)}
.bd-tabs{display:flex;gap:6px;padding:0 4px 10px}
.bd-tabs button{flex:1;padding:9px 0;border-radius:9px;background:var(--panel);border:1px solid var(--line);
  color:var(--ink-dim);font-size:13px;font-weight:700;text-align:center}
.bd-tabs button.active{background:var(--panel2);border-color:var(--blue);color:var(--ink)}
.bigbtn{display:block;width:calc(100% - 8px);margin:10px 4px;padding:15px;border-radius:12px;
  background:var(--blue);color:#fff;font-size:15px;font-weight:800;text-align:center}
.bigbtn.ghost{background:var(--panel);border:1px solid var(--line);color:var(--ink-dim)}
.session-done{background:var(--blue-dim);border:1px solid var(--blue);border-radius:14px;padding:16px;
  margin:14px 0;text-align:center}
.session-done .big{font-size:17px;font-weight:800}
.session-done .sm{font-size:13px;color:var(--ink-dim);margin-top:3px}
/* touch targets: 44px minimum on everything tappable */
.chip,.card-actions button,.opts button,nav button,.bd-tabs button,.set-row input,
.spine .wk,.slot,.lib-search input{min-height:44px}

/* Storage adapter. Mode is picked once at startup:
   'claude' → window.storage (Claude artifact) · 'local' → localStorage, ONLY when window.storage
   is absent (self-hosted, e.g. GitHub Pages) · 'memory' → nothing persists (a banner warns).
   get() → {ok:true, value, raw} (value null = nothing saved yet) or {ok:false, error, raw}.
   A failed read is never reported as "nothing saved", so the app can't overwrite real data with the seed. */
const store = {
  mem:{}, mode:'memory',
  init(){
    if(window.storage){ this.mode='claude'; return; }
    try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t'); this.mode='local'; }catch(e){} },
  async getRaw(k){ /* string | null; throws when the read itself fails */
    if(this.mode==='claude'){
      try{ const r=await window.storage.get(k); return r?r.value:null; }
      catch(e){ if(/not.?found|does not exist|no such key/i.test(String(e&&e.message))) return null; throw e; } }
    if(this.mode==='local') return localStorage.getItem('ironengine:'+k);
    return this.mem[k]??null; },
  async get(k){
    let raw;
    try{ raw=await this.getRaw(k); }catch(error){ return {ok:false,error,raw:null}; }
    if(raw==null) return {ok:true,value:null,raw:null};
    try{ return {ok:true,value:JSON.parse(raw),raw}; }catch(error){ return {ok:false,error,raw}; } },
  async setRaw(k,s){ /* true only when actually persisted */
    this.mem[k]=s;
    try{
      if(this.mode==='claude'){ await window.storage.set(k,s); return true; }
      if(this.mode==='local'){ localStorage.setItem('ironengine:'+k,s); return true; }
    }catch(e){}
    return false; },
  set(k,v){ return this.setRaw(k,JSON.stringify(v)); }
};

/* ---------- state schema ----------
   Saved state carries v; unversioned saves are v1. To change the stored shape:
   bump SCHEMA_VERSION, append the upgrade step to MIGRATIONS, update seedState(),
   and add a migration test. */
const SCHEMA_VERSION=6;
const MIGRATIONS=[   /* MIGRATIONS[n-1] upgrades a v(n) state to v(n+1), in place */
  /* v1→v2: feedback moves off the exercise (where it applied to every later week) into
     meso.fb[session][exercise]. A legacy answer is attributed to the latest week of that
     day with anything logged, i.e. the session it most plausibly described. */
  s=>{
    const M=s.meso; M.fb={};
    M.days.forEach((day,di)=>day.forEach((ex,i)=>{
      if(ex.feedback){
        let last=0;
        for(const k of Object.keys(M.log)){
          const m=/^w(\d+)d(\d+)$/.exec(k);
          if(m && +m[2]===di+1 && (M.log[k][i]||[]).some(x=>x&&x.st)) last=Math.max(last,+m[1]);
        }
        if(last) (M.fb[key(last,di+1)]=M.fb[key(last,di+1)]||[])[i]=ex.feedback;
      }
      delete ex.feedback;
    }));
    if(s.draft) s.draft.days.forEach(day=>day.forEach(ex=>delete ex.feedback));
  },
  /* v2→v3: finished mesos are archived whole instead of discarded */
  s=>{ s.archive=s.archive||[]; },
  /* v3→v4: meso.dates[session] = local date its first set was logged (drives history dates) */
  s=>{ s.meso.dates=s.meso.dates||{}; },
  /* v4→v5: plan slots get permanent ids, and each session becomes a list of entries
     {slot, name, sets, why, fb} instead of arrays lined up with the plan by position, so
     exercises can be swapped, added, removed or reordered mid-meso without breaking history.
     Feedback (meso.fb) and explanations (exercise._why) move into the entries. */
  s=>{
    const conv=M=>{
      let seq=0;
      M.days.forEach(day=>day.forEach(ex=>{ ex.id='s'+(++seq); if(ex.pri==null) ex.pri=1; }));
      M.seq=seq;
      const fb=M.fb||{};
      Object.keys(M.log).forEach(k=>{
        const m=/^w(\d+)d(\d+)$/.exec(k), day=m?M.days[+m[2]-1]||[]:[];
        M.log[k]=(M.log[k]||[]).map((sets,i)=>{
          const ex=day[i]; if(!ex) return null;
          const e={slot:ex.id,name:ex.name,sets:sets||null};
          if(ex._why&&ex._why[k]) e.why=ex._why[k];
          if((fb[k]||[])[i]) e.fb=fb[k][i];
          return e;
        }).filter(Boolean);
      });
      M.days.forEach(day=>day.forEach(ex=>delete ex._why));
      delete M.fb;
    };
    conv(s.meso);
    (s.archive||[]).forEach(m=>{ if(m&&m.days&&m.log) conv(m); });
  },
  /* v5→v6: exercises you create live in ST.custom and join the built-in catalog */
  s=>{ s.custom=s.custom||[]; },
];
function migrate(s){
  let v=s.v||1;
  if(v>SCHEMA_VERSION) throw new Error(`Saved data is from a newer app version (v${v}). Reload to update the app.`);
  while(v<SCHEMA_VERSION){ MIGRATIONS[v-1](s); v++; }
  s.v=SCHEMA_VERSION;
  return s;
}

/* ============================ @engine:begin ============================
   PROGRESSION ENGINE v2 — R1..R8
   Pure functions only: no DOM, storage, or app state. tests/harness.js runs
   everything from this banner to the engine:end marker headlessly in node.
   R8 soreness (recovery gate): asked per muscle at next session.
   0 never sore · 1 healed a while ago · 2 healed just on time · 3 still sore
   ============================================================ */
const RIR_RAMP=[3,2,2,1,0], DELOAD_RIR=8;
/* Every tunable coefficient. Calibration = change a value here + add a test. */
const RULES={
  loadStep:5,          // lb; prescribed loads round to this increment
  minLoad:5,           // lb; floor for any rounded load
  cutPct:0.08,         // R3 load cut (60→55 verified; the 8% itself is inferred)
  floorReps:4,         // R3: a later set at or below this many reps triggers the cut
  dropFromFirst:3,     // R3: a later set this many reps below set 1 triggers the cut
  painGate:2,          // R4: pain answer at or above this (2 = moderate) holds reps and sets
  setAdd:1,            // R2: sets added per exercise per week
  strongSetAdd:2,      // R5/R8: sets added on an under-stimulated signal
  staleWeeks:8,        // seeding: history older than this many weeks is discounted
  staleDiscount:0.10,  // seeding: discount on stale history
};
const pct=x=>Math.round(x*100);
function rirFor(week){ return week>RIR_RAMP.length ? DELOAD_RIR : RIR_RAMP[week-1]; }
function roundLoad(w){ return Math.max(RULES.minLoad,Math.round(w/RULES.loadStep)*RULES.loadStep); }
function weeksSince(dateStr){
  return Math.floor((Date.now()-new Date(dateStr).getTime())/(7*86400*1000));
}
function startingSets(name,hist,rir,nSets,opts){
  const n=nSets||2, o=opts||{}, when=o.when||'week 1', maint=o.maintenance??(n===1);
  const h=hist[name], why=[];
  const mk=w=>Array.from({length:n},()=>({w,tgt:null,rir,st:null,reps:null}));
  if(!h){ return {sets:mk(null),
    why:`No history for this exercise → enter a weight you can handle at ${rir} RIR; that seeds the engine.${maint?' Maintenance-priority slot: 1 starting set.':''}`}; }
  let w=h.w; const wk=h.date?weeksSince(h.date):null;
  if(wk!=null && wk>RULES.staleWeeks){ w=roundLoad(w*(1-RULES.staleDiscount));
    why.push(`Last performed ${wk} wks ago → starting load discounted ${pct(RULES.staleDiscount)}% to <b>${w}</b> (detraining buffer).`); }
  else why.push(`Seeded from your last top set: <b>${w}</b> (${h.date||'date unknown'}).`);
  why.push(`Work to ${rir} RIR — ${when} results become the baseline.`);
  if(maint) why.push(`Maintenance-priority slot: 1 starting set.`);
  return {sets:mk(w),why:why.join(' ')};
}
function prescribe(ex, prevSets, week, feedback){
  const rir = rirFor(week);
  const why=[];
  const logged=(prevSets||[]).filter(s=>s && s.st==='logged' && s.reps!=null);
  if(!prevSets || logged.length===0){
    let src=prevSets&&prevSets.length?prevSets:[{w:0}];
    if(week>RIR_RAMP.length){   /* deload still halves the sets when last week was skipped */
      src=src.slice(0,Math.max(1,Math.ceil(src.length/2)));
      return {sets:src.map(s=>({w:s.w,tgt:null,rir,st:null,reps:null})),
        why:`No logged sets last week → same weights; deload: <b>${src.length} set${src.length>1?'s':''}</b> at ${DELOAD_RIR} RIR (R6+R7).`};
    }
    const base=src.map(s=>({w:s.w,tgt:null,rir,st:null,reps:null}));
    return {sets:base,why:`No logged sets last week → same weights, work to <b>${rir} RIR</b> (R6).`};
  }
  if(week>RIR_RAMP.length){
    const n=Math.max(1,Math.ceil(logged.length/2));
    return {sets:logged.slice(0,n).map(s=>({w:s.w,tgt:null,rir:DELOAD_RIR,st:null,reps:null})),
      why:`Deload: <b>${n} set${n>1?'s':''}</b> at ${DELOAD_RIR} RIR — dissipate fatigue (R7).`};
  }
  const f=feedback||{};
  const painGate=f.pain>=RULES.painGate, soreGate=f.soreness===3;
  const firstReps=logged[0].reps;
  const sets=logged.map((s,i)=>{
    const drop=firstReps-s.reps;
    if(i>0 && (s.reps<=RULES.floorReps || drop>=RULES.dropFromFirst)){
      const cause=s.reps<=RULES.floorReps ? `${s.reps} reps last week (at or below the ${RULES.floorReps}-rep floor)`
        : `${s.reps} reps last week, ${drop} fewer than set 1`;
      const w=s.w ? roundLoad(s.w*(1-RULES.cutPct)) : s.w;
      /* never raise a load or claim a cut that rounding cancelled; bodyweight has nothing to cut */
      if(!s.w || w>=s.w){
        why.push(`Set ${i+1}: ${cause} → ${s.w?`the ${pct(RULES.cutPct)}% cut rounds back to ${s.w}, so load held at <b>${s.w}</b>`
          :'bodyweight, so no load to cut'}; work to ${rir} RIR (R3).`);
        return {w:s.w,tgt:null,rir,st:null,reps:null};
      }
      why.push(`Set ${i+1}: ${cause} → load cut to <b>${w}</b>, ${rir} RIR (R3).`);
      return {w,tgt:null,rir,st:null,reps:null};
    }
    return {w:s.w,tgt:painGate?s.reps:s.reps+1,rir:null,st:null,reps:null};
  });
  if(painGate){ why.push(`Joint pain → rep targets held, no set added (R4).`); return {sets,why:why.join(' ')}; }
  why.unshift(`Same weight, last week's reps <b>+1</b> (R1).`);
  if(soreGate){ why.push(`Still sore from last session → volume held, no set added (R8).`); }
  else if(f.workload===3){ why.push(`'Too much' workload → set count held (R5).`); }
  else{
    const strongAdd=(f.workload===0)||(f.soreness===0 && f.pump===0);
    const adds=strongAdd?RULES.strongSetAdd:RULES.setAdd;
    const lastW=sets[sets.length-1].w;
    for(let a=0;a<adds;a++) sets.push({w:lastW,tgt:null,rir,st:null,reps:null});
    why.push(`+${adds} set at <b>${lastW??'bodyweight'}</b> to <b>${rir} RIR</b> (R2${strongAdd?'+R5/R8: under-stimulated signal':''}).`);
  }
  return {sets,why:why.join(' ')};
}
/* ============================ @engine:end ============================== */

function toast(t){ const el=$('toast'); el.textContent=t; el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),1900); }

const escHtml=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);

let loadError=null;   /* saved data exists but couldn't be read: saving is blocked until the user decides */
let saveFailed=false;
async function init(){
  const r=await store.get('state2');
  let saved=null, upgrading=false;
  if(!r.ok) loadError=r;
  else if(r.value){
    try{ upgrading=r.value.v!==SCHEMA_VERSION; saved=migrate(r.value); }
    catch(error){ loadError={error,raw:r.raw}; }
  }
  ST=saved||seedState();
  ({w:selWeek,d:selDay}=resumePoint());
  ST.meso.curWeek=selWeek; ST.meso.curDay=selDay;
  await ensureDay(selWeek,selDay);
  if(upgrading) await save();
  render();
  if(loadError) renderLoadError();
}
/* Where the app opens: the latest session with anything logged or skipped, or the one after it
   once it's finished. Nothing logged yet → week 1 day 1. */
function resumePoint(){
  const M=ST.meso, weeks=RIR_RAMP.length+1, n=DAYS.length;
  let last=null;
  for(let w=1;w<=weeks;w++) for(let d=1;d<=n;d++)
    if((M.log[key(w,d)]||[]).some(e=>(e.sets||[]).some(s=>s.st))) last={w,d};
  if(!last) return {w:1,d:1};
  const finished=M.log[key(last.w,last.d)].every(e=>e.sets&&e.sets.every(s=>s.st));
  if(!finished || (last.w===weeks && last.d===n)) return last;
  return last.d<n ? {w:last.w,d:last.d+1} : {w:last.w+1,d:1};
}
async function save(){
  if(loadError) return;   /* never write over data we couldn't read */
  const ok=await store.set('state2',ST);
  if(saveFailed===ok){ saveFailed=!ok; renderBanner(); }
}
function renderBanner(){
  const msg=store.mode==='memory'?'Storage is blocked in this browser: nothing is being saved. Export a backup before closing.'
    :saveFailed?'Last save failed (storage full or blocked). Export a backup now.':'';
  $('banner').innerHTML=msg?`<div class="banner" onclick="setView('data')">⚠ ${msg}</div>`:'';
}
function renderLoadError(){
  const e=loadError, detail=escHtml(e.error&&e.error.message||e.error||'unknown error');
  $('modalRoot').innerHTML=`<div class="overlay"><div class="sheet">
    <h2>Couldn't read saved data</h2>
    <p class="sheet-p">Nothing has been changed or overwritten, and nothing will be saved until you choose below.</p>
    <p class="sheet-p" style="color:var(--ink-faint)">${detail}</p>
    <div class="sheet-stack">
      <button class="btn-primary" onclick="location.reload()">Retry</button>
      ${e.raw?`<button class="btn-ghost" onclick="copyRaw()">Copy raw saved data</button>`:''}
      <button class="btn-ghost" onclick="$('importInput').click()">Restore from backup file</button>
      <button class="btn-ghost" style="color:var(--red)" onclick="startFresh()">Start fresh</button>
    </div></div></div>`;
}
async function copyRaw(){
  try{ await navigator.clipboard.writeText(loadError.raw); toast('Copied'); }catch(e){ toast('Clipboard blocked'); }
}
/* Clears a load error by overwriting. Unreadable raw data is copied to a backup key first. */
async function overwriteUnreadable(){
  if(loadError.raw && !await store.setRaw(`state2.unreadable-${Date.now()}`,loadError.raw)){
    toast('Could not back up the old data, so nothing was overwritten'); return false; }
  loadError=null; $('modalRoot').innerHTML=''; return true;
}
async function startFresh(){
  if(!confirm(loadError.raw?'Start fresh? The unreadable data is kept under a backup key first.'
    :'Start fresh? This replaces whatever is saved. If the problem was temporary, choose Retry instead.')) return;
  if(!await overwriteUnreadable()) return;
  ST=seedState(); selWeek=ST.meso.curWeek; selDay=ST.meso.curDay;
  await ensureDay(selWeek,selDay); await save(); view='workout'; render();
}
function key(w,d){ return `w${w}d${d}`; }
/* local calendar date; toISOString() is UTC, which stamps US evening sessions as tomorrow */
function localDate(d=new Date()){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }

/* A session is a list of entries {slot, name, sets, why, fb}. Until the session is started (any entry
   touched), its entries follow the plan (M.days) and their numbers are recomputed on every visit, so
   looking ahead never freezes stale numbers. Once started, its exercise list is fixed; untouched entries
   still recompute. Touched entries (logged, skipped, edited, swapped) are never recomputed. */
const touchedEntry=e=>!!e&&(!!e.u||(e.sets||[]).some(s=>s.st||s.u));
const sessionSig=es=>JSON.stringify(es.map(e=>[e.slot,e.name]));
async function ensureDay(w,d){ if(planDay(w,d)) await save(); }
function planDay(w,d){ /* returns true when anything changed */
  const M=ST.meso, k=key(w,d), plan=M.days[d-1], old=M.log[k]||[], before=sessionSig(old);
  const entries=old.some(touchedEntry) ? old
    : plan.map(sl=>Object.assign(old.find(e=>e.slot===sl.id)||{slot:sl.id,sets:null},{name:sl.name}));
  let changed=!M.log[k] || sessionSig(entries)!==before;
  M.log[k]=entries;
  if(entries.every(touchedEntry)) return changed;
  if(w>1 && planDay(w-1,d)) changed=true;
  entries.forEach(e=>{
    if(touchedEntry(e)) return;
    const p=prescribeEntry(w,d,e);
    if(JSON.stringify([e.sets,e.why])!==JSON.stringify([p.sets,p.why])) changed=true;
    e.sets=p.sets; e.why=p.why;
  });
  return changed;
}
/* Numbers for entry e in session w/d come from the most recent earlier session of the same slot that
   did the same exercise: last week → R1-R8 as usual, with that session's feedback; an older week (the
   slot did something else in between, e.g. a one-off swap) → treated as a missed week (R6); none →
   seeded from history, which includes this meso's earlier sessions. */
function prescribeEntry(w,d,e){
  const M=ST.meso, slot=M.days[d-1].find(s=>s.id===e.slot);
  for(let pw=w-1;pw>=1;pw--){
    const pe=(M.log[key(pw,d)]||[]).find(x=>x.slot===e.slot);
    if(!pe||pe.name!==e.name||!pe.sets) continue;
    if(pw===w-1){
      const p=prescribe(e,pe.sets,w,pe.fb||null);
      if(!pe.sets.some(s=>s.st)) p.why=`Preview: ${DAYS[d-1]} week ${w-1} isn't logged yet, so this repeats its weights `
        +`at <b>${rirFor(w)} RIR</b>${w>RIR_RAMP.length?', half the sets (deload)':''}. Updates automatically once you log it.`;
      return p;
    }
    const p=prescribe(e,pe.sets.map(s=>({...s,st:'skipped'})),w,null);
    p.why=`Last week this slot did a different exercise (one-off swap). ${p.why}`;
    return p;
  }
  const prevE=w>1&&(M.log[key(w-1,d)]||[]).find(x=>x.slot===e.slot);
  const n=(prevE&&prevE.sets&&prevE.sets.length)||(slot&&slot.pri===0?1:2);
  if(w===1) return startingSets(e.name,effectiveHist(w,d),rirFor(1),n);
  const p=startingSets(e.name,effectiveHist(w,d),rirFor(w),n,{when:"this session's",maintenance:false});
  p.why=`New in this slot: ${p.why}`;
  return p;
}
/* ST.hist overlaid with this meso's sessions before w/d: seeds exercises swapped or added mid-meso */
function effectiveHist(w,d){ const h={...ST.hist}; harvestHistory(ST.meso,h,w*10+d); return h; }
const slotOf=(d,e)=>ST.meso.days[d-1].find(s=>s.id===e.slot);
/* display info: the plan slot when it matches (keeps per-meso muscle tags), else the catalog */
const exInfo=(name,slot)=>slot&&slot.name===name?slot:(libByName(name)||{name,mg:'BACK',equip:'?'});
const entryAt=ei=>ST.meso.log[key(selWeek,selDay)][ei];

function render(){
  renderHeader(); renderBanner(); renderSpine(); renderTabs();
  ({workout:renderWorkout,library:renderLibrary,builder:renderBuilder,engine:renderEngine,data:renderData})[view]();
  ['navW','navL','navB','navE','navD'].forEach(id=>$(id).classList.remove('active'));
  $({workout:'navW',library:'navL',builder:'navB',engine:'navE',data:'navD'}[view]).classList.add('active');
}
function renderHeader(){
  const M=ST.meso;
  const titles={workout:`WEEK ${selWeek} <span class="dim">DAY ${selDay}</span>`,library:'LIBRARY',
    builder:'MESO BUILDER',engine:'THE ENGINE',data:'DATA'};
  const subs={workout:`${DAYS[selDay-1]} · ${M.name} · target ${rirFor(selWeek)} RIR`,
    library:`${libAll().length} exercises · ${ST.custom.length} of them yours`,
    builder: ST.draft?`Draft: ${ST.draft.name}`:'Plan your next mesocycle',
    engine:'Every number, explained. No black box.',data:'Export, reset, storage'};
  $('hTitle').innerHTML=titles[view]; $('hSub').textContent=subs[view];
}
function renderSpine(){
  const el=$('spine');
  if(view!=='workout'){ el.innerHTML=''; return; }
  const dl=RIR_RAMP.length+1;
  el.innerHTML=Array.from({length:dl},(_,i)=>{
    const w=i+1, rir=w===dl?`DL · ${DELOAD_RIR} RIR`:RIR_RAMP[i]+' RIR';
    const cls=w===selWeek?'active':(w<ST.meso.curWeek?'done':'');
    return `<button class="wk ${cls}" onclick="pickWeek(${w})"><div class="n">${w===dl?'DL':w}</div><div class="r">${rir}</div></button>`;
  }).join('');
}
function renderTabs(){
  const el=$('daytabs'); const M=ST.meso;
  if(view!=='workout'){ el.innerHTML=''; return; }
  el.innerHTML=DAYS.map((d,i)=>{
    const k=key(selWeek,i+1), log=M.log[k];
    let st='—';
    if(log&&log.length){
      const flat=log.flatMap(e=>e.sets||[]), done=flat.filter(s=>s.st).length;
      st=done===flat.length&&done>0?'COMPLETE':done>0?`${done}/${flat.length}`:'PLANNED';
    }
    const stCls=st==='COMPLETE'?'complete':(st!=='—'&&st!=='PLANNED'?'partial':'');
    return `<button class="${i+1===selDay?'active':''} ${stCls}" onclick="pickDay(${i+1})">${d}<span class="st">${st}</span></button>`;
  }).join('');
}
async function pickWeek(w){ selWeek=w; await ensureDay(w,selDay); render(); }
async function pickDay(d){ selDay=d; await ensureDay(selWeek,d); render(); }
function setView(v){ view=v; render(); }

/* ---------- workout ---------- */
function renderWorkout(){
  const k=key(selWeek,selDay), log=ST.meso.log[k];
  let html='', lastMg='';
  log.forEach((e,i)=>{
    const slot=slotOf(selDay,e), ex=exInfo(e.name,slot), sets=e.sets||[], own=slot&&slot.name===e.name;
    if(ex.mg!==lastMg){ html+=`<span class="mg-tag" style="background:var(--mg-${ex.mg})">${ex.mg}</span>`; lastMg=ex.mg; }
    const why=e.why?`<div class="why">→ ${e.why}</div>`:'';
    html+=`<div class="card">
      <div class="ex-name">${e.name}</div>
      <div class="ex-meta">${ex.equip}${libByName(e.name)&&!libByName(e.name).home?'<span class="badge-gym">GYM</span>':''}
        ${slot&&!own?` · swapped in today for ${slot.name}`:''}</div>
      ${own&&slot.note?`<div class="ex-note">📌 ${escHtml(slot.note)}</div>`:''}
      <div class="set-head"><span></span><span>WEIGHT</span><span>REPS</span><span>LOG</span></div>
      ${sets.map((s,j)=>setRow(i,j,s)).join('')}
      ${why}
      <div class="card-actions">
        <button onclick="addSet(${i})">+ Set</button>
        ${sets.some(s=>!s.st)?`<button onclick="skipRest(${i})">Skip rest</button>`:''}
        <button class="${e.fb?'fb-done':''}" onclick="openFeedback(${i})">${e.fb?'✓ Feedback':'Feedback'}</button>
        <button class="more" onclick="openExMenu(${i})" aria-label="Exercise options">⋯</button>
      </div>
    </div>`;
  });
  html+=`<button class="bigbtn ghost" onclick="openAdd()">+ Add exercise</button>`;
  const flat=log.flatMap(e=>e.sets||[]);
  if(flat.length>0&&flat.every(s=>s.st))
    html+=`<div class="session-done"><div class="big">Session complete</div>
      <div class="sm">Next week's targets are computed from today's numbers.</div></div>`;
  $('main').innerHTML=html;
}
function setRow(ei,si,s){
  const repVal=s.st==='skipped'?'':(s.reps!=null?s.reps:(s.tgt!=null?s.tgt:''));
  const repPh=s.st==='skipped'?'skipped':(s.tgt==null&&s.reps==null?`${s.rir??2} RIR`:'');
  const btnCls=s.st==='logged'?'logged':s.st==='skipped'?'skipped':'next';
  const btnTxt=s.st==='logged'?'✓':s.st==='skipped'?'−':'';
  return `<div class="set-row">
    <span class="set-num">${si+1}</span>
    <input type="number" inputmode="decimal" value="${s.w??''}" onchange="upd(${ei},${si},'w',this.value)">
    <input type="number" inputmode="numeric" class="${repPh?'rir-ph':''}" value="${repVal}" placeholder="${repPh}"
      onchange="upd(${ei},${si},'reps',this.value)">
    <button class="log-btn ${btnCls}" onclick="tapLog(${ei},${si})">${btnTxt}</button>
  </div>`;
}
async function upd(ei,si,f,v){
  const s=entryAt(ei).sets[si];
  s[f]=v===''?null:parseFloat(v); s.u=1;   /* u: user-touched, freezes this exercise's prescription */
  await save();
}
/* Log button: open set → logged (empty reps take the target); logged or skipped → open again,
   reps kept. An open set with no reps and no target needs a second tap to skip. */
let skipArm=null;
async function tapLog(ei,si){
  const k=key(selWeek,selDay), s=entryAt(ei).sets[si], id=`${k}:${ei}:${si}`;
  if(s.st) s.st=null;
  else{
    if(s.reps==null && s.tgt!=null) s.reps=s.tgt;
    if(s.reps==null){
      if(skipArm!==id){ skipArm=id; toast('Enter reps first, or tap again to skip'); return; }
      s.st='skipped';
    } else{ s.st='logged'; ST.meso.dates[k]=ST.meso.dates[k]||localDate(); }
  }
  s.u=1; skipArm=null;
  await save(); render();
}
async function skipRest(ei){
  entryAt(ei).sets.forEach(s=>{ if(!s.st){ s.st='skipped'; s.reps=null; s.u=1; } });
  await save(); render();
}
async function addSet(ei){
  const sets=entryAt(ei).sets;
  const lastW=sets.length?sets[sets.length-1].w:null;
  sets.push({w:lastW,tgt:null,rir:rirFor(selWeek),st:null,reps:null,u:1});
  await save(); render();
}

/* ---------- feedback (now incl. soreness R8) ---------- */
let fbState=null;
function openFeedback(ei){
  const f=entryAt(ei).fb||{};
  fbState={ei,soreness:f.soreness??null,pain:f.pain??null,pump:f.pump??null,workload:f.workload??null};
  renderFB();
}
function renderFB(){
  const e=entryAt(fbState.ei), ex=exInfo(e.name,slotOf(selDay,e));
  const opt=(f,i,l)=>`<button class="${fbState[f]===i?'sel':''}" onclick="fbState.${f}=${i};renderFB()">${l}</button>`;
  $('modalRoot').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeFB()">
    <div class="sheet">
      <h2>Feedback</h2>
      <p style="color:var(--ink-dim);font-size:13px">${e.name} · ${ex.mg.toLowerCase()}</p>
      <div class="q"><h3>${cap(ex.mg)} soreness</h3><p>How sore did you get AFTER training them last time?</p>
        <div class="opts">${['Never got sore','Healed a while ago','Healed just on time',"I'm still sore!"].map((l,i)=>opt('soreness',i,l)).join('')}</div></div>
      <div class="q"><h3>Joint pain</h3><p>How did your joints feel during this exercise?</p>
        <div class="opts">${['None','Low pain','Moderate pain','A lot of pain'].map((l,i)=>opt('pain',i,l)).join('')}</div></div>
      <div class="q"><h3>Pump</h3><p>How much of a pump in your ${ex.mg.toLowerCase()}?</p>
        <div class="opts o3">${['Low pump','Moderate pump','Amazing pump'].map((l,i)=>opt('pump',i,l)).join('')}</div></div>
      <div class="q"><h3>Workload</h3><p>How was the number of hard sets?</p>
        <div class="opts">${['Not enough','Just right','Pushed my limits','Too much'].map((l,i)=>opt('workload',i,l)).join('')}</div></div>
      <div class="sheet-actions">
        <button class="btn-ghost" onclick="closeFB()">Cancel</button>
        <button class="btn-primary" ${[fbState.soreness,fbState.pain,fbState.pump,fbState.workload].some(x=>x==null)?'disabled':''}
          onclick="saveFB()">Save</button>
      </div>
    </div></div>`;
}
const cap=s=>s[0]+s.slice(1).toLowerCase();
function closeFB(){ $('modalRoot').innerHTML=''; fbState=null; }
async function saveFB(){
  entryAt(fbState.ei).fb={soreness:fbState.soreness,pain:fbState.pain,pump:fbState.pump,workload:fbState.workload};
  await save(); closeFB(); render(); toast('Saved — feeds next week (R2/R4/R5/R8)');
}

async function makeDraft(){
  const M=ST.meso;
  ST.draft={name:'Next meso (draft)',weeks:5,
    days:M.days.map(day=>day.map(ex=>({name:ex.name,mg:ex.mg,equip:ex.equip,note:ex.note,pri:ex.pri??1})))};
  bdDay=1; await save(); render();
}
/* most recently performed home-compatible exercise per mg, excluding already-used names */
function autoPick(mg,used){
  const cands=CATALOG.filter(c=>c.mg===mg&&c.home&&!used.has(c.name))
    .sort((a,b)=>(b.last||'').localeCompare(a.last||''));
  return cands[0]||CATALOG.find(c=>c.mg===mg&&c.home)||CATALOG.find(c=>c.mg===mg);
}
async function makeDraftFromTemplate(ti){
  const t=TEMPLATES[ti];
  ST.draft={name:t.name+' (draft)',weeks:5,days:t.days.map(day=>{
    const used=new Set();
    return day.map(([mg,pri,pinned])=>{
      const c=pinned&&CAT_BY_NAME[pinned]?CAT_BY_NAME[pinned]:autoPick(mg,used);
      used.add(c.name);
      return {name:c.name,mg,equip:c.equip,note:null,pri,_auto:!pinned};
    });
  })};
  bdDay=1; await save(); render();
  toast('Slots auto-filled — tap any to swap');
}
function openSwap(slotIdx){
  swapCtx={mode:'draft',slotIdx,mg:ST.draft.days[bdDay-1][slotIdx].mg,home:true,q:'',
    exclude:ST.draft.days[bdDay-1][slotIdx].name};
  renderSwap();
}
function renderSwap(){

      <div class="chiprow">
        <button class="chip home ${c.home?'sel':''}" onclick="swapCtx.home=!swapCtx.home;renderSwap()">⌂ Home only</button>

        ${MGS.map(m=>`<button class="chip ${c.mg===m?'sel':''}" onclick="swapCtx.mg='${m}';renderSwap()">${cap(m)}</button>`).join('')}

function renderSwapList(){
  const c=swapCtx;
  const list=libAll().filter(x=>x.name!==c.exclude&&(c.mg==='ALL'||x.mg===c.mg)&&(!c.home||x.home)
    &&(!c.q||x.name.toLowerCase().includes(c.q.toLowerCase())));
  list.sort((a,b)=>a.name.localeCompare(b.name));
  $('swapList').innerHTML=list.map(x=>{const h=ST.hist[x.name];
    return `<button class="lib-item" onclick="doSwap('${esc(x.name)}')">
    <span class="dot" style="background:var(--mg-${x.mg})"></span>
    <span class="li-main"><span class="li-name">${x.name}${x.custom?'<span class="badge-mine">MINE</span>':''}${x.home?'':'<span class="badge-gym">GYM</span>'}</span>

    <span class="li-right">${h?`<div class="li-w">${h.w}</div>`:''}<div class="li-date">${x.last||''}</div></span>

}
function closeSwap(){ $('modalRoot').innerHTML=''; swapCtx=null; }
async function doSwap(name){
  if(swapCtx.mode==='entry') return chooseSwapScope(name);
  if(swapCtx.mode==='add') return chooseAddScope(name);
  if(swapCtx.mode==='draftAdd') return draftAdd(name);
  const c=libByName(name), slot=ST.draft.days[bdDay-1][swapCtx.slotIdx];
  Object.assign(slot,{name:c.name,mg:c.mg,equip:c.equip,_swapped:true,_auto:false,note:null});
  closeSwap(); await save(); render(); toast(`Swapped in ${name}`);
}

      <button class="btn-primary" ${logged?'disabled':''} onclick="swapEntry(${ei},'${esc(name)}','today')">Just today</button>

/* ---------- editing a day in the active meso ----------
   Plan edits (M.days) shape every session not started yet; today's session changes with them, except
   that sets already logged are never removed. Sessions already started keep their own list. */
async function moveEntry(ei,dir){
  const M=ST.meso, log=M.log[key(selWeek,selDay)], j=ei+dir;
  if(j<0||j>=log.length) return;
  const plan=M.days[selDay-1], a=plan.findIndex(s=>s.id===log[ei].slot), b=plan.findIndex(s=>s.id===log[j].slot);
  [log[ei],log[j]]=[log[j],log[ei]];
  if(a>=0&&b>=0) [plan[a],plan[b]]=[plan[b],plan[a]];
  closeSwap(); await ensureDay(selWeek,selDay); await save(); render();
}
async function removeEntry(ei){
  const M=ST.meso, log=M.log[key(selWeek,selDay)], e=log[ei], plan=M.days[selDay-1];
  const inPlan=plan.some(s=>s.id===e.slot), logged=(e.sets||[]).some(s=>s.st==='logged');
  if(!inPlan&&logged){ toast('Already logged today, so it stays'); return; }
  if(!confirm(inPlan?`Remove ${e.name} from ${DAYS[selDay-1]} for the rest of the meso?${logged?' The sets you logged today stay.':''}`
    :`Remove ${e.name} from today?`)) return;
  if(inPlan) M.days[selDay-1]=plan.filter(s=>s.id!==e.slot);
  if(!logged) log.splice(ei,1);
  closeSwap(); await ensureDay(selWeek,selDay); await save(); render();
}
function openAdd(){ swapCtx={mode:'add',mg:'ALL',home:true,q:'',exclude:null}; renderSwap(); }
function chooseAddScope(name){
  $('modalRoot').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeSwap()"><div class="sheet">
    <h2>Add exercise</h2>
    <p class="sheet-p"><b>${name}</b> → ${DAYS[selDay-1]}</p>
    <div class="sheet-stack">
      <button class="btn-primary" onclick="addEntry('${esc(name)}','today')">Just today</button>
      <button class="btn-ghost" onclick="addEntry('${esc(name)}','meso')">Today + rest of meso</button>
      <button class="btn-ghost" onclick="closeSwap()">Cancel</button>
    </div></div></div>`;
}
/* 'today': an extra entry in this session only (frozen with u). 'meso': a new plan slot, so every later
   session gets it too. Either way it gets its own slot id and is seeded by prescribeEntry(). */
async function addEntry(name,scope){
  const M=ST.meso, c=libByName(name), id='s'+(++M.seq), e={slot:id,name:c.name,sets:null};
  if(scope==='meso') M.days[selDay-1].push({id,name:c.name,mg:c.mg,equip:c.equip,note:null,pri:1});
  else e.u=1;
  M.log[key(selWeek,selDay)].push(e);
  const p=prescribeEntry(selWeek,selDay,e); e.sets=p.sets; e.why=p.why;
  closeSwap(); await ensureDay(selWeek,selDay); await save(); render();
  toast(scope==='today'?`${c.name} added for today`:`${c.name} added to ${DAYS[selDay-1]}`);
}

/* A note belongs to the plan slot, so it shows every week this exercise is done in that slot. */
async function editNote(ei){
  const slot=slotOf(selDay,entryAt(ei));
  const v=prompt(`Note for ${slot.name} (leave empty to remove)`,slot.note||'');
  if(v===null) return;
  slot.note=v.trim().slice(0,120)||null;
  closeSwap(); await save(); render();
}

/* ---------- your own exercises ----------
   Stored in ST.custom and offered everywhere the built-in catalog is. Names are permanent (history is
   keyed by name) and can't contain " < > \ so they stay safe inside the page markup. */
let newEx=null;
function openNewEx(from){
  const mg=from&&from.mg&&from.mg!=='ALL'?from.mg:null;
  newEx={name:'',mg,equip:null,home:null,err:'',from:from?{...from}:null};
  renderNewEx();
}
function renderNewEx(){
  const n=newEx, home=n.home??(n.equip?isHome({name:n.name,equip:n.equip}):null);
  const chips=(field,vals,lbl)=>vals.map(v=>`<button class="chip ${n[field]===v?'sel':''}"
    onclick="newEx.${field}='${v}';renderNewEx()">${lbl(v)}</button>`).join('');
  $('modalRoot').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeNewEx()"><div class="sheet">
    <h2>New exercise</h2>
    <div class="form-label">Name</div>
    <input class="form-input" id="newExName" maxlength="60" autocapitalize="words" placeholder="e.g. Cable Row (Wide Grip)"
      value="${escHtml(n.name)}" oninput="newEx.name=this.value">
    <div class="form-label">Muscle group</div><div class="chip-wrap">${chips('mg',MGS,cap)}</div>
    <div class="form-label">Equipment</div><div class="chip-wrap">${chips('equip',EQUIP,v=>v)}</div>
    <div class="form-label">Can you do it at home?</div><div class="chip-wrap">
      <button class="chip home ${home===true?'sel':''}" onclick="newEx.home=true;renderNewEx()">⌂ Yes</button>
      <button class="chip ${home===false?'sel':''}" onclick="newEx.home=false;renderNewEx()">Gym only</button></div>
    <div class="form-err">${escHtml(n.err)}</div>
    <div class="sheet-actions">
      <button class="btn-ghost" onclick="closeNewEx()">Cancel</button>
      <button class="btn-primary" onclick="saveNewEx()">Save</button>
    </div></div></div>`;
}
function newExError(n){
  const name=n.name.trim();
  if(!name) return 'Give it a name.';
  if(/["<>\\]/.test(name)) return 'Names can\'t contain " < > or \\.';
  if(libAll().some(c=>c.name.toLowerCase()===name.toLowerCase())) return 'That name is already in the library.';
  if(!n.mg) return 'Pick a muscle group.';
  if(!n.equip) return 'Pick the equipment.';
  return '';
}
async function saveNewEx(){
  const n=newEx; n.err=newExError(n);
  if(n.err){ renderNewEx(); return; }
  const name=n.name.trim();
  ST.custom.push({name,mg:n.mg,equip:n.equip,home:n.home??isHome({name,equip:n.equip}),last:null,custom:true});
  await save(); toast(`${name} added to your library`);
  const from=n.from; newEx=null;
  if(from){ swapCtx=from; return doSwap(name); }   /* created from the picker: carry on with it */
  $('modalRoot').innerHTML=''; render();
}
function closeNewEx(){
  const from=newEx&&newEx.from; newEx=null;
  if(from){ swapCtx=from; renderSwap(); } else $('modalRoot').innerHTML='';
}
const inUse=name=>ST.meso.days.flat().some(s=>s.name===name)
  ||Object.values(ST.meso.log).some(es=>es.some(e=>e.name===name))
  ||!!(ST.draft&&ST.draft.days.flat().some(s=>s.name===name));
function openCustomMenu(name){
  $('modalRoot').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeSwap()"><div class="sheet">
    <h2>${name}</h2><p class="sheet-p">Your exercise.${ST.hist[name]?` Last top set ${ST.hist[name].w}.`:''}</p>
    <div class="sheet-stack">
      <button class="btn-ghost" style="color:var(--red)" onclick="deleteCustom('${esc(name)}')">Delete from library</button>
      <button class="btn-ghost" onclick="closeSwap()">Cancel</button>
    </div></div></div>`;
}
async function deleteCustom(name){
  if(inUse(name)){ toast('In use in your current meso or draft, so it stays'); return; }
  if(!confirm(`Delete ${name} from your library? Past history keeps its name.`)) return;
  ST.custom=ST.custom.filter(c=>c.name!==name);
  closeSwap(); await save(); render();
}

/* scope 'today': only this session's entry changes (frozen with u so the plan can't revert it).
   scope 'meso': the plan slot changes too, so every later session follows. Sets already logged
   today are never replaced. The new exercise is seeded by prescribeEntry(). */
async function swapEntry(ei,name,scope){
  const e=entryAt(ei), slot=slotOf(selDay,e), c=libByName(name);
  const logged=(e.sets||[]).some(s=>s.st==='logged');
  if(scope==='today'&&logged) return;
  if(scope==='meso'&&slot) Object.assign(slot,{name:c.name,mg:c.mg,equip:c.equip,note:null});
  if(!logged){
    e.name=c.name; delete e.fb;
    if(scope==='today'&&!(slot&&slot.name===c.name)) e.u=1; else delete e.u;
    const p=prescribeEntry(selWeek,selDay,e); e.sets=p.sets; e.why=p.why;
  }
  closeSwap(); await ensureDay(selWeek,selDay); await save(); render();
  toast(scope==='today'?`${c.name}, just for today`:`${c.name} for the rest of the meso`);
}
/* ---------- editing a draft day (Builder) ---------- */
function openSlotMenu(i){
  const a=ST.draft.days[bdDay-1], s=a[i];
  $('modalRoot').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeSwap()"><div class="sheet">
    <h2>${s.name}</h2>
    <p class="sheet-p">${s.pri===0?'Maintenance: starts at 1 set':'Full priority: starts at 2 sets'}</p>
    <div class="sheet-stack">
      <button class="btn-ghost" onclick="openSwap(${i})">Swap exercise</button>
      <button class="btn-ghost" onclick="editDraftNote(${i})">${s.note?'Edit note':'Add note'}</button>
      <button class="btn-ghost" onclick="togglePri(${i})">${s.pri===0?'Make full priority (2 sets)':'Make maintenance (1 set)'}</button>
      ${i>0?`<button class="btn-ghost" onclick="draftMove(${i},-1)">Move up</button>`:''}
      ${i<a.length-1?`<button class="btn-ghost" onclick="draftMove(${i},1)">Move down</button>`:''}
      <button class="btn-ghost" style="color:var(--red)" onclick="draftRemove(${i})">Remove</button>
      <button class="btn-ghost" onclick="closeSwap()">Cancel</button>
    </div></div></div>`;
}
async function draftMove(i,dir){
  const a=ST.draft.days[bdDay-1], j=i+dir;
  if(j<0||j>=a.length) return;
  [a[i],a[j]]=[a[j],a[i]]; closeSwap(); await save(); render();
}
async function draftRemove(i){ ST.draft.days[bdDay-1].splice(i,1); closeSwap(); await save(); render(); }
async function togglePri(i){ const s=ST.draft.days[bdDay-1][i]; s.pri=s.pri===0?1:0; closeSwap(); await save(); render(); }
async function editDraftNote(i){
  const s=ST.draft.days[bdDay-1][i], v=prompt(`Note for ${s.name} (leave empty to remove)`,s.note||'');
  if(v===null) return;
  s.note=v.trim().slice(0,120)||null; closeSwap(); await save(); render();
}
function openDraftAdd(){ swapCtx={mode:'draftAdd',mg:'ALL',home:true,q:'',exclude:null}; renderSwap(); }
async function draftAdd(name){
  const c=libByName(name);
  ST.draft.days[bdDay-1].push({name:c.name,mg:c.mg,equip:c.equip,note:null,pri:1,_swapped:true});
  closeSwap(); await save(); render(); toast(`${c.name} added to ${DAYS[bdDay-1]}`);
}
async function discardDraft(){
  if(!confirm('Discard this draft? The current meso is not affected.')) return;
  ST.draft=null; await save(); render();
}
/* History = each exercise's LAST top set: the heaviest logged set in its most recent session
   (schedule order), dated when that session was trained. It can go down. Sessions logged before
   dates were recorded borrow the meso's latest known date, or null (shown as "date unknown"). */
function harvestHistory(M,hist,before=Infinity){ /* before: only sessions earlier than week*10+day */
  const order=k=>{ const m=/^w(\d+)d(\d+)$/.exec(k); return m?(+m[1])*10+(+m[2]):-1; };
  const fallback=Object.values(M.dates).sort().pop()||null;
  Object.keys(M.log).filter(k=>order(k)>0&&order(k)<before).sort((a,b)=>order(a)-order(b)).forEach(k=>{
    (M.log[k]||[]).forEach(e=>{
      const logged=(e.sets||[]).filter(s=>s.st==='logged'&&s.w);
      if(logged.length) hist[e.name]={w:Math.max(...logged.map(s=>s.w)),date:M.dates[k]||fallback};
    });
  });
}
async function activateDraft(){
  if(!confirm(`Start "${ST.draft.name.replace(' (draft)','')}" now?\n\nThe current meso moves to the archive (all its sets are kept) and its top sets update your exercise history.`)) return;
  const M=ST.meso;
  harvestHistory(M,ST.hist);
  ST.archive.push({...M,archivedAt:localDate()});
  const D=ST.draft;
  let seq=0;
  ST.meso={name:D.name.replace(' (draft)','')+' · '+localDate(),weeks:D.weeks,curWeek:1,curDay:1,
    days:D.days.map(day=>day.map(ex=>({id:'s'+(++seq),name:ex.name,mg:ex.mg,equip:ex.equip,note:ex.note,pri:ex.pri??1}))),
    log:{},dates:{},seq};
  ST.draft=null; selWeek=1; selDay=1;
  await ensureDay(1,1); await save();
  view='workout'; render(); toast('New meso active — history carried forward');
}

/* ---------- engine ---------- */
function renderEngine(){
  $('main').innerHTML=`
  <div class="eng-block"><h3>R1 · Rep progression</h3>
    <p>Same weight, last week's reps <code>+1</code> per matched set. Verified vs RP exactly.</p></div>
  <div class="eng-block"><h3>R2 · Set addition</h3>
    <p>+${RULES.setAdd} set/exercise/week by default; new sets get weight only, worked to the week's RIR. Gated by R4/R5/R8.</p></div>
  <div class="eng-block"><h3>R3 · Load autoregulation</h3>
    <p>Later sets at <code>≤${RULES.floorReps} reps</code> or <code>≥${RULES.dropFromFirst}</code> below set 1 → <code>~${pct(RULES.cutPct)}%</code> load cut, RIR reset. Verified: 60×4 → RP prescribed 55. Exact match.</p></div>
  <div class="eng-block"><h3>R4 · Pain gate</h3>
    <p>Moderate+ joint pain → rep targets held, no set added.</p></div>
  <div class="eng-block"><h3>R5 · Workload feedback</h3>
    <p><code>Too much</code> → hold set count. <code>Not enough</code> → +${RULES.strongSetAdd} sets.</p></div>
  <div class="eng-block"><h3>R6 · Missing data</h3>
    <p>All sets skipped → same weights re-prescribed, RIR target only. Matches RP.</p></div>
  <div class="eng-block"><h3>R7 · Deload</h3>
    <p>Week ${RIR_RAMP.length+1}: half the sets at ${DELOAD_RIR} RIR.</p></div>
  <div class="eng-block"><h3>R8 · Soreness (recovery gate)</h3>
    <p>Asked per muscle: still sore → volume held. Never sore + low pump → strongest add signal (+${RULES.strongSetAdd} sets).
    'Healed just on time' is the optimum — standard progression.</p></div>
  <div class="eng-block"><h3>Cross-meso seeding</h3>
    <p>Exercises own their history. Returning after <code>>${RULES.staleWeeks} wks</code> → last load −${pct(RULES.staleDiscount)}%; sooner → last load as-is; week 1 always works to RIR.</p></div>`;
}

/* ---------- data ---------- */
function renderData(){
  $('main').innerHTML=`
  <div class="eng-block"><h3>Backup</h3><p>Everything (current meso, history, ${ST.archive.length} archived
    meso${ST.archive.length===1?'':'s'}, draft) in one file. Save it to Files or iCloud. Restoring replaces all current data.</p>
    <div class="card-actions"><button onclick="saveBackup()">Save backup file</button><button onclick="doExport()">Copy JSON</button></div>
    <div class="card-actions"><button onclick="$('importInput').click()">Restore from backup file</button></div></div>
  <div class="eng-block"><h3>Storage</h3><p>${{
    claude:'Saved in Claude artifact storage.',
    local:'Saved in this browser only. On iPhone, the home-screen app and Safari keep separate copies: always use the same one. Back up regularly.',
    memory:'<b style="color:var(--red)">Not being saved.</b> This browser blocks storage; everything is lost when the app closes. Export now.'}[store.mode]}</p></div>
  <div class="eng-block"><h3>Reset</h3><p>Erases everything, including history and the archive, and restores the RP-screenshot seed.</p>
    <div class="card-actions"><button onclick="doReset()" style="color:var(--red)">Reset to seed</button></div></div>`;
}
const backupJSON=()=>JSON.stringify(ST,null,1);
async function saveBackup(){
  const name=`ironengine-backup-${localDate()}.json`;
  const file=new File([backupJSON()],name,{type:'application/json'});
  try{ /* iPhone: share sheet → Save to Files / iCloud / AirDrop */
    if(navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:name}); return; }
  }catch(e){ if(e.name==='AbortError') return; }
  const a=document.createElement('a'); a.href=URL.createObjectURL(file); a.download=name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
async function doExport(){
  try{ await navigator.clipboard.writeText(backupJSON()); toast('Copied'); }
  catch(e){ toast('Clipboard blocked — see console'); console.log(backupJSON()); }
}
function parseBackup(text){
  let s;
  try{ s=JSON.parse(text); }catch(e){ return {ok:false,error:'Not a valid backup file'}; }
  if(!s||typeof s!=='object'||!s.meso||!Array.isArray(s.meso.days)||!s.meso.log||typeof s.hist!=='object')
    return {ok:false,error:'Not an IRON ENGINE backup'};
  try{ migrate(s); }catch(e){ return {ok:false,error:e.message}; }
  return {ok:true,state:s};
}
async function importText(text){
  const r=parseBackup(text);
  if(!r.ok){ toast(r.error); return false; }
  const s=r.state;
  if(!confirm(`Replace ALL current data with this backup?\n\n${s.meso.name} · ${Object.keys(s.hist).length} exercises in history · ${s.archive.length} archived`)) return false;
  if(loadError && !await overwriteUnreadable()) return false;
  ST=s; selWeek=ST.meso.curWeek; selDay=ST.meso.curDay;
  await ensureDay(selWeek,selDay); await save(); view='workout'; render(); toast('Backup restored');
  return true;
}
async function importFile(input){
  const f=input.files&&input.files[0]; input.value='';
  if(f) await importText(await f.text());
}
async function doReset(){
  if(!confirm('Erase EVERYTHING (current meso, history, archive) and restore the demo seed?\n\nSave a backup first. This cannot be undone.')) return;
  ST=seedState(); selWeek=ST.meso.curWeek; selDay=ST.meso.curDay;
  await ensureDay(selWeek,selDay); await save(); view='workout'; render(); toast('Reset');
}
init();
</script>
